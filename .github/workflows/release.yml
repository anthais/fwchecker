name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Packages
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"
      
      - name: Update Cargo.toml version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          echo "Updated Cargo.toml version to ${VERSION}"
          grep "^version" Cargo.toml
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssh2-1-dev pkg-config mingw-w64 zip
      
      - name: Install cargo tools
        run: |
          cargo install cargo-deb cargo-generate-rpm
      
      - name: Build release binary
        run: cargo build --release

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Build Windows binary
        run: cargo build --release --target x86_64-pc-windows-gnu
      
      - name: Build Debian package
        run: cargo deb
      
      - name: Build RPM package
        run: cargo generate-rpm
      
      - name: Create checksums
        run: |
          cd target/debian && sha256sum *.deb > fwchecker.deb.sha256
          cd ../../target/generate-rpm && sha256sum *.rpm > fwchecker.rpm.sha256
      
      - name: Get package names
        id: packages
        run: |
          echo "deb=$(ls target/debian/*.deb)" >> $GITHUB_OUTPUT
          echo "rpm=$(ls target/generate-rpm/*.rpm)" >> $GITHUB_OUTPUT

      - name: Package Windows binary
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist/windows
          cp target/x86_64-pc-windows-gnu/release/fwchecker.exe dist/windows/
          cd dist/windows
          zip "fwchecker-${version}-windows.zip" fwchecker.exe
          sha256sum "fwchecker-${version}-windows.zip" > "fwchecker-${version}-windows.zip.sha256"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.packages.outputs.deb }}
            ${{ steps.packages.outputs.rpm }}
            target/debian/fwchecker.deb.sha256
            target/generate-rpm/fwchecker.rpm.sha256
            dist/windows/fwchecker-${{ steps.version.outputs.version }}-windows.zip
            dist/windows/fwchecker-${{ steps.version.outputs.version }}-windows.zip.sha256
          body: |
            ## FWChecker ${{ steps.version.outputs.version }}
            
            Fast, reliable network connectivity checker written in Rust.
            
            ### 📦 Installation
            
            **Debian/Ubuntu:**
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/fwchecker_${{ steps.version.outputs.version }}-1_amd64.deb
            sudo apt install ./fwchecker_${{ steps.version.outputs.version }}-1_amd64.deb
            ```
            
            **CentOS/RHEL/Fedora:**
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/fwchecker-${{ steps.version.outputs.version }}-1.x86_64.rpm
            sudo dnf install ./fwchecker-${{ steps.version.outputs.version }}-1.x86_64.rpm
            ```
            
            **Windows (PowerShell):**
            ```powershell
            Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/fwchecker-${{ steps.version.outputs.version }}-windows.zip" -OutFile "fwchecker-${{ steps.version.outputs.version }}-windows.zip"
            Expand-Archive -Path "fwchecker-${{ steps.version.outputs.version }}-windows.zip" -DestinationPath "."
            .\fwchecker.exe --help
            ```
            
            ### ✨ Features
            - Multi-source checks (local or remote via SSH)
            - Multiple check types (ping, telnet, curl)
            - TOML configuration with type-safe parsing
            - Multiple output formats (pretty, CSV, TSV, table)
            - Auto port opening for testing
            
            ### 📚 Documentation
            See [README.md](https://github.com/${{ github.repository }}#readme) for full documentation.
            
            ### 🔐 Checksums
            Download the `.sha256` files to verify package integrity.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

