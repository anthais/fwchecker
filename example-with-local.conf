# Firewall Checker Configuration - Example với Local Hosts
# 
# File này là ví dụ đầy đủ bao gồm cả local hosts
# Sao chép và chỉnh sửa theo môi trường của bạn

# ============================================================
# EXTERNAL HOSTS - Kiểm tra từ xa
# ============================================================

# Kiểm tra DNS servers
external,8.8.8.8,0,ping
external,1.1.1.1,0,ping

# Kiểm tra các dịch vụ public
external,google.com,443,telnet
external,github.com,443,both

# Kiểm tra mail server
external,smtp.gmail.com,587,telnet

# ============================================================
# LOCAL HOSTS - Có thể SSH vào để mở port
# ============================================================

# Web server internal
# local,192.168.1.10,80,telnet,webadmin,SecurePass123

# Database server
# local,192.168.1.20,3306,both,dbadmin,DbPass456

# Application server
# local,192.168.1.30,8080,telnet,appuser,AppPass789

# ============================================================
# CHÚ Ý:
# ============================================================
# 1. Bỏ comment (#) ở đầu dòng local hosts và điền thông tin thực
# 2. Đặt quyền file: chmod 600 example-with-local.conf
# 3. KHÔNG commit file có password thật vào git
# 4. Local hosts yêu cầu SSH access và netcat được cài đặt
# 5. User SSH cần có quyền bind port (root cho ports < 1024)

