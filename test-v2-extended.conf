# Test config with multiple hosts and newline directive

[HOST:local]
type=local

[HOST:dns]
type=external
ip=8.8.8.8

[HOST:google]
type=external
ip=google.com

[HOST:github]
type=external
ip=github.com

[CHECK:local]
# Check external services
cmd=ping dns
cmd=telnet dns 53
newline

cmd=ping google
cmd=telnet google 443
cmd=curl -s -o /dev/null -w "%{http_code}" https://google.com
newline

cmd=ping github
cmd=telnet github 443
cmd=curl -s -o /dev/null -w "%{http_code}" https://github.com
newline

